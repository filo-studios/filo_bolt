name: Release

on:
  push:
    branches: [main]
    paths: [fxmanifest.lua]
  workflow_dispatch:
    inputs:
      portal:
        description: Upload to the Cfx portal
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new version
        id: version
        run: |
          v=$(grep -oP "^\s*version\s+['\"]\K[^'\"]+" fxmanifest.lua)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            {
              echo 'notes<<NOTES_EOF'
              tr -d '\r' < CHANGELOG.md | awk -v v="$v" '/^## /{p = ($2==v || $2=="v"v || $2=="["v"]"); next} p'
              echo 'NOTES_EOF'
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Build zip
        if: steps.version.outputs.new == 'true' && (github.event_name != 'workflow_dispatch' || inputs.portal)
        run: git archive --format=zip --prefix="${{ github.event.repository.name }}/" -o "$RUNNER_TEMP/${{ github.event.repository.name }}.zip" HEAD

      - name: Upload to Cfx portal
        if: steps.version.outputs.new == 'true' && (github.event_name != 'workflow_dispatch' || inputs.portal)
        uses: Tynopia/cfx-portal-upload@9a73f3fd7b928005d551a77c3d9cd20e9b396e32 # v1.2.6
        with:
          cookie: ${{ secrets.FORUM_COOKIE }}
          assetId: 1031296
          makeZip: false
          zipPath: ${{ runner.temp }}/${{ github.event.repository.name }}.zip
          changelog: ${{ steps.version.outputs.notes }}
      - name: Post patch notes
        if: steps.version.outputs.new == 'true'
        uses: filo-studios/release-notifier@v1
        with:
          webhook: ${{ secrets.DISCORD_PATCH_NOTES_WEBHOOK }}
          role-id: '1517205170927435958'
          channel-id: '1519524672641699991'
